# Single-origin deployment: Django serves both the React SPA and the versioned API.
services:
  - type: web
    name: alib
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      npm --prefix frontend install --no-audit --no-fund &&
      npm --prefix frontend run build &&
      rm -rf backend/static/frontend &&
      mkdir -p backend/static/frontend &&
      cp -R frontend/dist/. backend/static/frontend/ &&
      cd backend &&
      python manage.py collectstatic --noinput
    startCommand: >-
      cd backend &&
      python manage.py migrate --noinput &&
      python manage.py bootstrap_admin &&
      gunicorn alib_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: alib
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: TIME_ZONE
        value: Africa/Kigali
      - key: ALIB_SCHEDULER_TOKEN
        sync: false
