name: ALIB CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend typecheck, build, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm test
  backend:
    name: Django checks and API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      TIME_ZONE: Africa/Kigali
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Database migrations
        run: python manage.py migrate --noinput
      - name: Test API and privacy rules
        run: python manage.py test --verbosity 2
  render-package:
    name: Combined Render build and SPA smoke test
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      TIME_ZONE: Africa/Kigali
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Build React bundle
        run: npm --prefix frontend run build
      - name: Package frontend for WhiteNoise
        run: |
          mkdir -p backend/static/frontend
          cp -R frontend/dist/. backend/static/frontend/
      - name: Collect static assets and smoke-test deployed routes
        run: |
          cd backend
          python manage.py collectstatic --noinput
          python manage.py migrate --noinput
          python manage.py check
          python manage.py shell -c "from django.test import Client; c=Client(HTTP_HOST='localhost'); page=c.get('/discover'); assert page.status_code == 200, page.status_code; assert b'id=\"root\"' in b''.join(page.streaming_content); api=c.get('/api/v1/content/'); assert api.status_code == 200, api.status_code; print('Render SPA route and public API smoke tests passed.')"
