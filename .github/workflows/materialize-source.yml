name: Materialize ALIB source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-source.yml"
      - "bootstrap/alib-source-part-*.b64"
permissions:
  contents: write
jobs:
  materialize:
    name: Extract ALIB application into repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode source archive and install project files
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/alib-source-part-*.b64 | base64 --decode | tar -xz
          rm -rf bootstrap
          rm -f .github/workflows/materialize-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The application tree did not produce any changes."
            exit 1
          fi
          git commit -m "feat: initialize ALIB creator platform"
          git push origin HEAD:main
